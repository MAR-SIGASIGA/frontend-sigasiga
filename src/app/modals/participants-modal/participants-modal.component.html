<ion-header>
  <ion-toolbar>
    <ion-title>Participantes</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding modal-content" fullscreen>
  <ion-row>
    <ion-col size="12" class="ion-text-center">
      <p-button icon="pi pi-user-plus" severity="info" [outlined]="true" size="large" [rounded]="true" [raised]="true" (click)="addParticipant()">
      </p-button>
    </ion-col>
  </ion-row>
  <ion-list *ngIf="participants?.length; else noParticipants">
    <ng-container *ngFor="let p of participants">
      <!-- Fila con el participante -->
      <ion-item>
        <ion-avatar slot="start">
          <img [src]="'https://avatar.iran.liara.run/public'" alt="Avatar" />
        </ion-avatar>
        <ion-label>
          <p>{{ p.user_id }}</p>
        </ion-label>
        <p-button *ngIf="expandedParticipantId !== p.user_id" icon="pi pi-eye" 
        severity="info" [outlined]="true" size="small" [rounded]="true" [raised]="true" (click)="viewDetails(p)" class="ion-margin-start">
        </p-button>
        <p-button *ngIf="expandedParticipantId === p.user_id" icon="pi pi-eye-slash" 
        severity="info" [outlined]="true" size="small" [rounded]="true" [raised]="true" (click)="viewDetails(p)">
        </p-button>
      </ion-item>

      <!-- Detalles expandibles debajo -->
      <ion-card *ngIf="expandedParticipantId === p.user_id" class="ion-margin translucent-card">
        <img class="neon-border" [src]="getRestUrl() + '/config/join_qr_img_bytes?user_id=' + p.user_id + '&token=' + getToken()" alt="QR" />
        <ion-card-content class="url-container">
          <div class="url-wrapper">
            <a [href]="p.join_url" target="_blank" rel="noopener noreferrer" class="url-link">
              {{ p.join_url }}
            </a>
            <ion-button fill="clear" size="small" (click)="copyToClipboard(p.join_url)">
              <ion-icon slot="icon-only" name="copy-outline"></ion-icon>
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </ng-container>
  </ion-list>

  <ng-template #noParticipants>
    <p>No hay participantes.</p>
  </ng-template>

  
</ion-content>
