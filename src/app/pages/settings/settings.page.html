<ion-content [fullscreen]="true">
  <div class="main-container">
  <ion-content class="ion-padding">

    <!-- Contenedor 1: Configuración de Streaming -->
     <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="settings-outline" color="medium" slot="start"></ion-icon>
          <ion-row>
            <ion-col size="10">
              <ion-label>Finalizar Evento</ion-label>
            </ion-col>
            <ion-col size="2">
              <p-confirmdialog />
              <p-button
              icon="pi pi-power-off" 
              severity="danger" 
              [outlined]="true" 
              size="large" 
              [rounded]="true"
              [raised]="true"
              (onClick)="stopEvent($event)"
              class="stop-event-button"
              />
            </ion-col>
          </ion-row>
        </ion-card-title>
      </ion-card-header>
     </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="settings-outline" color="medium" slot="start"></ion-icon>
          Configuración de Streaming
        </ion-card-title>
      </ion-card-header>
  
      <ion-card-content>
        <!-- Fila 1: RTMP Key -->
        <ion-item lines="none" class="input-row">
          <ion-icon name="key-outline" slot="start" color="medium"></ion-icon>
        
          
        </ion-item>
        <ion-item>
          <div class="input-with-button">
            <ion-input
              [(ngModel)]="rtmpKeyInput"
              placeholder="Introduce tu RTMP key"
              class="custom-input"
            ></ion-input>
            <p-button
              icon="pi pi-send"
              severity="info"
              [outlined]="true"
              size="large"
              [rounded]="true"
              [raised]="true"
              (onClick)="enviarRTMPKey()"
            />
            
          </div>
        </ion-item>
        <!-- Fila 2: Transmitir en YouTube -->
        <ion-item lines="none">
          <ion-icon name="logo-youtube" slot="start" color="medium"></ion-icon>
          <ion-label>Transmitir en Vivo por RTMP</ion-label>
        </ion-item>
        <ion-item >
          <ion-label *ngIf="!rtmpToogle" position="close">Comenzar transmisión</ion-label>
          <ion-label *ngIf="rtmpToogle" position="close">Detener transmisión</ion-label>
          <p-toggleswitch slot="end" [(ngModel)]="rtmpToogle" (onChange)="toogleRtmp()"  [disabled]="!isRtmpToogleEnabled()"></p-toggleswitch>
        </ion-item>
      </ion-card-content>
    </ion-card>
  
    <!-- Contenedor 2: Configuración de Participantes -->
    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="people-outline" color="medium" slot="start"></ion-icon>
          Configuración de Participantes
        </ion-card-title>
      </ion-card-header>
  
      <ion-card-content>
        <ion-item lines="none">
          <ion-icon name="person-add-outline" slot="start" color="medium"></ion-icon>
          <ion-label>Participantes</ion-label>
          <p-button
            icon="pi pi-user-edit"
            severity="info"
            [outlined]="true"
            size="large"
            [rounded]="true"
            [raised]="true"
            slot="end"
            (onClick)="openParticipantsModal()"

          />
          
        </ion-item>
      </ion-card-content>
    </ion-card>
  
  </ion-content>
</div>
  
</ion-content>
